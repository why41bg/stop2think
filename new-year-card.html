<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>元旦快乐 - 2025</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* 雪花动画 */
        .snowflake {
            position: absolute;
            top: -10px;
            color: white;
            font-size: 1em;
            font-family: Arial;
            text-shadow: 0 0 5px white;
            animation: fall linear infinite;
            opacity: 0.8;
        }

        @keyframes fall {
            to {
                transform: translateY(100vh) rotate(360deg);
            }
        }

        /* 贺卡容器 */
        .card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 60px 80px;
            max-width: 600px;
            text-align: center;
            position: relative;
            z-index: 10;
            animation: cardAppear 1s ease-out;
            transform-style: preserve-3d;
        }

        @keyframes cardAppear {
            from {
                opacity: 0;
                transform: scale(0.8) translateY(50px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        /* 装饰元素 */
        .decoration {
            position: absolute;
            width: 100px;
            height: 100px;
            opacity: 0.1;
        }

        .decoration.top-left {
            top: -30px;
            left: -30px;
            background: radial-gradient(circle, #ff6b6b, transparent);
            border-radius: 50%;
            animation: float 3s ease-in-out infinite;
        }

        .decoration.top-right {
            top: -30px;
            right: -30px;
            background: radial-gradient(circle, #4ecdc4, transparent);
            border-radius: 50%;
            animation: float 3s ease-in-out infinite 1s;
        }

        .decoration.bottom-left {
            bottom: -30px;
            left: -30px;
            background: radial-gradient(circle, #ffe66d, transparent);
            border-radius: 50%;
            animation: float 3s ease-in-out infinite 2s;
        }

        .decoration.bottom-right {
            bottom: -30px;
            right: -30px;
            background: radial-gradient(circle, #95e1d3, transparent);
            border-radius: 50%;
            animation: float 3s ease-in-out infinite 1.5s;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) scale(1);
            }
            50% {
                transform: translateY(-20px) scale(1.1);
            }
        }

        /* 标题 */
        .title {
            font-size: 3.5em;
            font-weight: bold;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 20px;
            animation: titleShine 3s ease-in-out infinite;
            text-shadow: 0 0 30px rgba(102, 126, 234, 0.5);
        }

        @keyframes titleShine {
            0%, 100% {
                filter: brightness(1);
            }
            50% {
                filter: brightness(1.2);
            }
        }

        /* 年份 */
        .year {
            font-size: 5em;
            font-weight: bold;
            background: linear-gradient(135deg, #ff6b6b, #feca57, #48dbfb, #ff9ff3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 30px 0;
            animation: yearPulse 2s ease-in-out infinite;
            position: relative;
        }

        @keyframes yearPulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }

        /* 祝福语 */
        .greeting {
            font-size: 1.5em;
            color: #333;
            line-height: 1.8;
            margin: 30px 0;
            animation: fadeInUp 1s ease-out 0.5s both;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 装饰线 */
        .divider {
            width: 100px;
            height: 3px;
            background: linear-gradient(90deg, transparent, #667eea, transparent);
            margin: 30px auto;
            animation: expand 1s ease-out 0.8s both;
        }

        @keyframes expand {
            from {
                width: 0;
            }
            to {
                width: 100px;
            }
        }

        /* 按钮 */
        .button {
            margin-top: 40px;
            padding: 15px 40px;
            font-size: 1.2em;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
            animation: fadeInUp 1s ease-out 1s both;
        }

        .button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.6);
        }

        .button:active {
            transform: translateY(-1px);
        }

        /* 烟花效果 */
        .firework {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            pointer-events: none;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .card {
                padding: 40px 30px;
                margin: 20px;
            }

            .title {
                font-size: 2.5em;
            }

            .year {
                font-size: 3.5em;
            }

            .greeting {
                font-size: 1.2em;
            }
        }
    </style>
</head>
<body>
    <!-- 雪花背景 -->
    <div id="snowflakes"></div>

    <!-- 贺卡 -->
    <div class="card">
        <!-- 装饰元素 -->
        <div class="decoration top-left"></div>
        <div class="decoration top-right"></div>
        <div class="decoration bottom-left"></div>
        <div class="decoration bottom-right"></div>

        <!-- 内容 -->
        <div class="title">元旦快乐</div>
        <div class="year">2025</div>
        <div class="divider"></div>
        <div class="greeting">
            愿新的一年<br>
            充满希望与美好<br>
            健康快乐，万事如意！
        </div>
        <button class="button" onclick="createFireworks()">🎆 庆祝一下</button>
    </div>

    <script>
        // 创建雪花
        function createSnowflakes() {
            const snowflakesContainer = document.getElementById('snowflakes');
            const snowflakeSymbols = ['❄', '❅', '❆'];
            
            for (let i = 0; i < 50; i++) {
                const snowflake = document.createElement('div');
                snowflake.className = 'snowflake';
                snowflake.textContent = snowflakeSymbols[Math.floor(Math.random() * snowflakeSymbols.length)];
                snowflake.style.left = Math.random() * 100 + '%';
                snowflake.style.animationDuration = (Math.random() * 3 + 2) + 's';
                snowflake.style.animationDelay = Math.random() * 2 + 's';
                snowflake.style.opacity = Math.random() * 0.5 + 0.5;
                snowflake.style.fontSize = (Math.random() * 10 + 10) + 'px';
                snowflakesContainer.appendChild(snowflake);
            }
        }

        // 创建烟花效果
        function createFireworks() {
            const colors = ['#ff6b6b', '#4ecdc4', '#ffe66d', '#95e1d3', '#feca57', '#48dbfb', '#ff9ff3'];
            
            for (let i = 0; i < 20; i++) {
                setTimeout(() => {
                    const x = Math.random() * window.innerWidth;
                    const y = Math.random() * window.innerHeight;
                    
                    for (let j = 0; j < 30; j++) {
                        const firework = document.createElement('div');
                        firework.className = 'firework';
                        firework.style.left = x + 'px';
                        firework.style.top = y + 'px';
                        firework.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                        firework.style.boxShadow = `0 0 10px ${firework.style.backgroundColor}`;
                        
                        const angle = (Math.PI * 2 * j) / 30;
                        const velocity = 50 + Math.random() * 50;
                        const vx = Math.cos(angle) * velocity;
                        const vy = Math.sin(angle) * velocity;
                        
                        document.body.appendChild(firework);
                        
                        let posX = x;
                        let posY = y;
                        let opacity = 1;
                        
                        const animate = () => {
                            posX += vx * 0.1;
                            posY += vy * 0.1 + 2; // 重力效果
                            opacity -= 0.02;
                            
                            firework.style.left = posX + 'px';
                            firework.style.top = posY + 'px';
                            firework.style.opacity = opacity;
                            
                            if (opacity > 0) {
                                requestAnimationFrame(animate);
                            } else {
                                firework.remove();
                            }
                        };
                        
                        requestAnimationFrame(animate);
                    }
                }, i * 100);
            }
        }

        // 页面加载时创建雪花
        window.addEventListener('load', () => {
            createSnowflakes();
        });

        // 鼠标移动时的交互效果
        document.querySelector('.card').addEventListener('mousemove', (e) => {
            const card = e.currentTarget;
            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;
            
            const rotateX = (y - centerY) / 20;
            const rotateY = (centerX - x) / 20;
            
            card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
        });

        document.querySelector('.card').addEventListener('mouseleave', (e) => {
            e.currentTarget.style.transform = 'perspective(1000px) rotateX(0) rotateY(0)';
        });
    </script>
</body>
</html>
